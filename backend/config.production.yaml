# config.yaml

# ───── App Settings ─────
version: 0.0.1
debug: false
environment: production
api_base_url: https://cognaite.com/api
frontend_url: https://cognaite.com

# ───── Auth Settings ─────
access_token_expire_minutes: 1440
algorithm: HS256
http_only: true
cookie_max_age: 86400
cookie_expiration_check: 86400
same_site: strict
secure: true
domain: cognaite.com
google_auth_client_id: your-google-client-id
google_redirect_uris:
  - https://cognaite.com/api/user/auth/callback
google_javascript_origins:
  - http://cognaite.com
# ───── CORS Settings ─────
cors_origins:
  - http://cognaite.com

cors_allow_credentials: true
cors_allow_methods:
  - GET
  - POST
  - PUT
  - DELETE
cors_allow_headers:
  - "*"

# ───── Telemetry Settings ─────
traces_sample_rate: 1.0
profiles_sample_rate: 0.1
post_hog_host: https://eu.posthog.com
monitoring_enabled: false

# ───── Database Settings ─────
# POSTGRES_DB: mydb
# POSTGRES_USER: admin
# db_host: localhost
# db_port: 5432
expire_on_commit: false
auto_commit: false
auto_flush: false

# ───── Redis Settings ─────
redis_host: redis
redis_port: "6378"
redis_max_connections: 20
redis_socket_connection_timeout: 10
redis_socket_timeout: 10
redis_cache_time: 86400
redis_link_cache_time: 31536000

# ───── AWS / S3 Settings ─────
s3_default_region: eu-north-1
s3_logging_level: ERROR
s3_uri: s3://my-bucket
s3_bucket: my-bucket


smtp_server: smtp.gmail.com
smtp_port: 587
